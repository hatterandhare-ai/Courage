<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Courage Wall — Wear It Purple Day</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --purple: #7c3aed;
    --blue: #3b82f6;
    --green: #10b981;
    --yellow: #f59e0b;
    --orange: #f97316;
    --red: #ef4444;
    --ink: #1f2937;
    --bg: #f5f3ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  .view { display: none; min-height: 100vh; }
  .view.active { display: block; }

  /* ---------- Voter view ---------- */
  #voter-view {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }
  #voter-view.active { display: flex; }

  .voter-header {
    text-align: center;
    max-width: 560px;
    margin-bottom: 24px;
  }
  .voter-header h1 {
    color: var(--purple);
    margin-bottom: 8px;
    font-size: 1.8rem;
  }
  .voter-header p { color: #4b5563; }

  .commitment-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    width: 100%;
    max-width: 420px;
  }
  .commitment-btn {
    border: none;
    border-radius: 12px;
    padding: 18px 20px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    text-align: left;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    transition: transform 0.1s ease;
  }
  .commitment-btn:active { transform: scale(0.98); }
  .commitment-btn:disabled { opacity: 0.6; cursor: default; }

  .thank-you {
    display: none;
    text-align: center;
    margin-top: 32px;
  }
  .thank-you.active { display: block; }
  .thank-you h2 { color: var(--green); }
  .thank-you button {
    margin-top: 16px;
    background: none;
    border: 1px solid var(--purple);
    color: var(--purple);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
  }

  .view-links {
    position: fixed;
    bottom: 8px;
    right: 8px;
    font-size: 0.75rem;
    opacity: 0.4;
  }
  .view-links a { color: var(--ink); margin-left: 8px; text-decoration: none; }
  .view-links a:hover { opacity: 1; text-decoration: underline; }

  /* ---------- Display view ---------- */
  #display-view {
    padding: 24px;
  }
  .display-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .display-header h1 { color: var(--purple); margin: 0; font-size: 1.5rem; }
  .vote-count { font-size: 1.1rem; font-weight: 600; }

  .collage {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-content: flex-start;
  }
  .sticky-note {
    width: 130px;
    min-height: 90px;
    padding: 10px;
    border-radius: 4px;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-break: break-word;
  }

  .empty-state {
    color: #6b7280;
    font-style: italic;
    margin-top: 40px;
    text-align: center;
  }

  /* ---------- Admin view ---------- */
  #admin-view { padding: 24px; max-width: 640px; margin: 0 auto; }
  #admin-view h1 { color: var(--purple); }

  .pin-gate {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 260px;
  }
  .pin-gate input {
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
  }
  .pin-gate button, .admin-panel button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--purple);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  .pin-error { color: var(--red); font-size: 0.85rem; display: none; }
  .pin-error.active { display: block; }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
    margin: 16px 0 24px;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .stat-card .label { font-size: 0.8rem; color: #6b7280; }
  .stat-card .value { font-size: 1.4rem; font-weight: 700; }

  .admin-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .admin-actions .danger { background: var(--red); }
  .admin-actions .secondary { background: var(--blue); }

  #qrcode-container {
    background: #fff;
    display: inline-block;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  @media (max-width: 480px) {
    .sticky-note { width: 100px; min-height: 80px; font-size: 0.72rem; }
    .voter-header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<!-- ===================== VOTER VIEW ===================== -->
<div id="voter-view" class="view">
  <div class="voter-header">
    <h1>Courage Wall</h1>
    <p>Wear It Purple Day — pick one commitment you're making today.</p>
  </div>

  <div class="commitment-list" id="commitment-list"></div>

  <div class="thank-you" id="thank-you">
    <h2>Thank you! 💜</h2>
    <p>Your commitment has been added to the wall.</p>
    <button id="vote-again-btn">Vote again</button>
  </div>

  <div class="view-links">
    <a href="?view=display">Display</a>
    <a href="?view=admin">Admin</a>
  </div>
</div>

<!-- ===================== DISPLAY VIEW ===================== -->
<div id="display-view" class="view">
  <div class="display-header">
    <h1>Courage Wall — Live</h1>
    <div class="vote-count"><span id="display-count">0</span> commitments made</div>
  </div>
  <div class="collage" id="collage"></div>
  <div class="empty-state" id="empty-state">No votes yet — be the first to add one!</div>
</div>

<!-- ===================== ADMIN VIEW ===================== -->
<div id="admin-view" class="view">
  <h1>Admin</h1>

  <div class="pin-gate" id="pin-gate">
    <label for="pin-input">Enter admin PIN</label>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" />
    <button id="pin-submit-btn">Unlock</button>
    <div class="pin-error" id="pin-error">Incorrect PIN</div>
  </div>

  <div class="admin-panel" id="admin-panel">
    <div class="stats-grid" id="stats-grid"></div>

    <div class="admin-actions">
      <button id="demo-votes-btn" class="secondary">Add 10 demo votes</button>
      <button id="reset-votes-btn" class="danger">Reset all votes</button>
    </div>

    <h2>Voter QR code</h2>
    <div id="qrcode-container"></div>
    <p id="voter-url-text" style="font-size:0.85rem;color:#6b7280;word-break:break-all;"></p>
  </div>
</div>

<script>
(function () {
  // Update this to your deployed Worker URL (see DEPLOYMENT.md).
  const API_BASE_URL = window.COURAGE_WALL_API_BASE || "";
  const ADMIN_PIN = "1234";

  const COMMITMENTS = [
    { key: "Learn more", color: "var(--purple)" },
    { key: "Attend training", color: "var(--blue)" },
    { key: "Challenge assumptions", color: "var(--green)" },
    { key: "Speak up", color: "var(--yellow)" },
    { key: "Support colleague", color: "var(--orange)" },
    { key: "Share story", color: "var(--red)" },
  ];

  function apiUrl(path) {
    return API_BASE_URL ? API_BASE_URL.replace(/\/$/, "") + path : path;
  }

  // ---------- View routing ----------
  const params = new URLSearchParams(window.location.search);
  const view = params.get("view") || "voter";
  ["voter", "display", "admin"].forEach((v) => {
    document.getElementById(v + "-view").classList.toggle("active", v === view);
  });

  // ---------- Voter view ----------
  if (view === "voter") {
    const list = document.getElementById("commitment-list");
    const thankYou = document.getElementById("thank-you");

    COMMITMENTS.forEach((c) => {
      const btn = document.createElement("button");
      btn.className = "commitment-btn";
      btn.style.background = c.color;
      btn.textContent = c.key;
      btn.addEventListener("click", () => submitVote(c.key, btn));
      list.appendChild(btn);
    });

    async function submitVote(commitment, btn) {
      list.querySelectorAll("button").forEach((b) => (b.disabled = true));
      try {
        const res = await fetch(apiUrl("/api/vote"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ commitment }),
        });
        if (!res.ok) throw new Error("Vote failed");
        list.style.display = "none";
        thankYou.classList.add("active");
      } catch (err) {
        alert("Something went wrong submitting your vote. Please try again.");
        list.querySelectorAll("button").forEach((b) => (b.disabled = false));
      }
    }

    document.getElementById("vote-again-btn").addEventListener("click", () => {
      thankYou.classList.remove("active");
      list.style.display = "grid";
      list.querySelectorAll("button").forEach((b) => (b.disabled = false));
    });
  }

  // ---------- Display view ----------
  if (view === "display") {
    const collage = document.getElementById("collage");
    const countEl = document.getElementById("display-count");
    const emptyState = document.getElementById("empty-state");
    const colorByCommitment = Object.fromEntries(COMMITMENTS.map((c) => [c.key, c.color]));
    let renderedCount = 0;

    function seededRotation(index) {
      // deterministic pseudo-random rotation so notes don't jitter between polls
      const x = Math.sin(index * 999) * 10000;
      return ((x - Math.floor(x)) * 10 - 5).toFixed(1);
    }

    function renderVotes(votes) {
      if (votes.length < renderedCount) {
        // votes were reset — rebuild from scratch
        collage.innerHTML = "";
        renderedCount = 0;
      }

      for (let i = renderedCount; i < votes.length; i++) {
        const v = votes[i];
        const note = document.createElement("div");
        note.className = "sticky-note";
        note.style.background = colorByCommitment[v.commitment] || "#9ca3af";
        note.style.transform = `rotate(${seededRotation(i)}deg)`;
        note.textContent = v.commitment;
        collage.appendChild(note);
      }
      renderedCount = votes.length;

      countEl.textContent = votes.length;
      emptyState.style.display = votes.length === 0 ? "block" : "none";
    }

    async function poll() {
      try {
        const res = await fetch(apiUrl("/api/votes"));
        const data = await res.json();
        renderVotes(data.votes || []);
      } catch (err) {
        // silently retry on next tick
      }
    }

    poll();
    setInterval(poll, 1000);
  }

  // ---------- Admin view ----------
  if (view === "admin") {
    const pinGate = document.getElementById("pin-gate");
    const pinInput = document.getElementById("pin-input");
    const pinSubmitBtn = document.getElementById("pin-submit-btn");
    const pinError = document.getElementById("pin-error");
    const adminPanel = document.getElementById("admin-panel");
    const statsGrid = document.getElementById("stats-grid");
    const demoVotesBtn = document.getElementById("demo-votes-btn");
    const resetVotesBtn = document.getElementById("reset-votes-btn");

    let enteredPin = "";
    let pollHandle = null;

    function unlock() {
      const value = pinInput.value.trim();
      if (value !== ADMIN_PIN) {
        pinError.classList.add("active");
        return;
      }
      enteredPin = value;
      pinError.classList.remove("active");
      pinGate.style.display = "none";
      adminPanel.classList.add("active");
      setupQrCode();
      refreshStats();
      pollHandle = setInterval(refreshStats, 2000);
    }

    pinSubmitBtn.addEventListener("click", unlock);
    pinInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlock();
    });

    async function refreshStats() {
      try {
        const res = await fetch(apiUrl("/api/votes"));
        const data = await res.json();
        const votes = data.votes || [];

        const counts = Object.fromEntries(COMMITMENTS.map((c) => [c.key, 0]));
        votes.forEach((v) => {
          if (counts[v.commitment] !== undefined) counts[v.commitment]++;
        });

        statsGrid.innerHTML = "";
        const total = document.createElement("div");
        total.className = "stat-card";
        total.innerHTML = `<div class="label">Total votes</div><div class="value">${votes.length}</div>`;
        statsGrid.appendChild(total);

        COMMITMENTS.forEach((c) => {
          const card = document.createElement("div");
          card.className = "stat-card";
          card.innerHTML = `<div class="label">${c.key}</div><div class="value">${counts[c.key]}</div>`;
          statsGrid.appendChild(card);
        });
      } catch (err) {
        // ignore transient errors
      }
    }

    function setupQrCode() {
      const voterUrl = window.location.origin + window.location.pathname;
      document.getElementById("voter-url-text").textContent = voterUrl;
      new QRCode(document.getElementById("qrcode-container"), {
        text: voterUrl,
        width: 180,
        height: 180,
      });
    }

    demoVotesBtn.addEventListener("click", async () => {
      demoVotesBtn.disabled = true;
      try {
        const requests = Array.from({ length: 10 }, () => {
          const c = COMMITMENTS[Math.floor(Math.random() * COMMITMENTS.length)];
          return fetch(apiUrl("/api/vote"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ commitment: c.key }),
          });
        });
        await Promise.all(requests);
        await refreshStats();
      } finally {
        demoVotesBtn.disabled = false;
      }
    });

    resetVotesBtn.addEventListener("click", async () => {
      if (!confirm("Reset all votes? This cannot be undone.")) return;
      resetVotesBtn.disabled = true;
      try {
        const res = await fetch(apiUrl("/api/votes"), {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: enteredPin }),
        });
        if (!res.ok) throw new Error("Reset failed");
        await refreshStats();
      } catch (err) {
        alert("Failed to reset votes.");
      } finally {
        resetVotesBtn.disabled = false;
      }
    });
  }
})();
</script>
</body>
</html>
